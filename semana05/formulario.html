<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM 3D Hub – Avaliação de Produto</title>
    <meta name="description" content="Formulário de avaliação de componentes e acessórios para Impressão 3D FDM.">
    <meta name="author" content="Richard Machado da Rocha">
    <link rel="stylesheet" href="estilos/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/obterdatas.js" defer></script>

    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>FDM 3D Hub</h1>
        <p>Avaliação de Componentes de Impressão 3D</p>
    </header>

    <main>
        <div class="form-container">
            <h2>Deixe sua Avaliação</h2>
            
            <form action="avaliacao.html" method="get">
                <div class="field-group">
                    <label for="produto">Nome do Produto <span class="required">*</span></label>
                    <select id="produto" name="produto" required>
                        <option value="" disabled selected>Selecione um Produto...</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Classificação Geral <span class="required">*</span></label>
                    <div class="rating-group">
                        <label><input type="radio" name="classificacao" value="1" required> ⭐ 1</label>
                        <label><input type="radio" name="classificacao" value="2" required> ⭐⭐ 2</label>
                        <label><input type="radio" name="classificacao" value="3" required> ⭐⭐⭐ 3</label>
                        <label><input type="radio" name="classificacao" value="4" required> ⭐⭐⭐⭐ 4</label>
                        <label><input type="radio" name="classificacao" value="5" required> ⭐⭐⭐⭐⭐ 5</label>
                    </div>
                </div>

                <div class="field-group">
                    <label for="dataInstalacao">Data de Instalação <span class="required">*</span></label>
                    <input type="date" id="dataInstalacao" name="dataInstalacao" required>
                </div>

                <div class="field-group">
                    <label>Recursos Úteis (Marque todos os aplicáveis):</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="recursos" value="montagem"> Montagem Fácil</label>
                        <label><input type="checkbox" name="recursos" value="qualidade"> Alta Qualidade de Impressão</label>
                        <label><input type="checkbox" name="recursos" value="durabilidade"> Durabilidade do Material</label>
                        <label><input type="checkbox" name="recursos" value="custobeneficio"> Excelente Custo-Benefício</label>
                    </div>
                </div>

                <div class="field-group">
                    <label for="avaliacaoEscrita">Avaliação Escrita (Opcional)</label>
                    <textarea id="avaliacaoEscrita" name="avaliacaoEscrita" rows="4" placeholder="Escreva sua experiência com o componente..."></textarea>
                </div>

                <div class="field-group">
                    <label for="nomeUsuario">Nome de Usuário (Opcional)</label>
                    <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Seu nome ou apelido">
                </div>

                <div class="field-group">
                    <input type="submit" value="Enviar Avaliação" class="submit-btn">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="anoatual">2026</span> Richard Machado da Rocha | Paraná, Brasil</p>
        <p>Última Modificação: <span id="ultimaModificacao"></span></p>
    </footer>
</body>
</html>
