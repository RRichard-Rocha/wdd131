<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM 3D Hub – Avaliação de Produto</title>
    <meta name="description" content="Formulário de avaliação de componentes e acessórios para Impressão 3D FDM.">
    <meta name="author" content="Richard Machado da Rocha">
    <link rel="stylesheet" href="estilos/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/obterdatas.js" defer></script>

    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>FDM 3D Hub</h1>
        <p>Avaliação de Componentes de Impressão 3D</p>
    </header>

    <main>
        <div class="form-container">
            <h2>Deixe sua Avaliação</h2>
            
            <form action="avaliacao.html" method="get">
                <div class="field-group">
                    <label for="produto">Nome do Produto <span class="required">*</span></label>
                    <select id="produto" name="produto" required>
                        <option value="" disabled selected>Selecione um Produto...</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Classificação Geral <span class="required">*</span></label>
                    <div class="rating-group">
                        <div>
                            <input type="radio" id="star1" name="classificacao" value="1" required>
                            <label for="star1">⭐ 1</label>
                        </div>
                        <div>
                            <input type="radio" id="star2" name="classificacao" value="2" required>
                            <label for="star2">⭐⭐ 2</label>
                        </div>
                        <div>
                            <input type="radio" id="star3" name="classificacao" value="3" required>
                            <label for="star3">⭐⭐⭐ 3</label>
                        </div>
                        <div>
                            <input type="radio" id="star4" name="classificacao" value="4" required>
                            <label for="star4">⭐⭐⭐⭐ 4</label>
                        </div>
                        <div>
                            <input type="radio" id="star5" name="classificacao" value="5" required>
                            <label for="star5">⭐⭐⭐⭐⭐ 5</label>
                        </div>
                    </div>
                </div>

                <!-- Recursos Úteis -->
                <div class="field-group">
                    <label>Recursos Úteis (Marque todos os aplicáveis):</label>
                    <div class="checkbox-group">
                        <div>
                            <input type="checkbox" id="recurso1" name="recursos" value="montagem">
                            <label for="recurso1">Montagem Fácil</label>
                        </div>
                        <div>
                            <input type="checkbox" id="recurso2" name="recursos" value="qualidade">
                            <label for="recurso2">Alta Qualidade de Impressão</label>
                        </div>
                        <div>
                            <input type="checkbox" id="recurso3" name="recursos" value="durabilidade">
                            <label for="recurso3">Durabilidade do Material</label>
                        </div>
                        <div>
                            <input type="checkbox" id="recurso4" name="recursos" value="custobeneficio">
                            <label for="recurso4">Excelente Custo-Benefício</label>
                        </div>
                    </div>
                </div>
    </main>

    <footer>
        <p>&copy;<span id="anoatual">2026</span> Richard Machado da Rocha | Paraná, Brasil</p>
        <p>Última Modificação: <span id="ultimaModificacao"></span></p>
    </footer>
</body>
</html>
